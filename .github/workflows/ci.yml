name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /dev/null .

  installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [debian:12, ubuntu:24.04, fedora:44]
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq bash util-linux ca-certificates
          else
            dnf install -y --setopt=install_weak_deps=False bash util-linux ca-certificates
          fi
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test installer
        run: bash tests/install.sh
